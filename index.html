<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wochenplan">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F3F5F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E141D" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Studium & Triathlon</title>
<style>
@font-face{font-family:"Barlow";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-condensed-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2")}
/* Layout: Schriftfeld wie auf einer Bauzeichnung als Kopf, darunter das Zeitraster. iPhone: Tagesansicht, iPad: Wochenraster. */
:root{
  --paper:#F3F5F8; --sheet:#FFFFFF; --we:#F7F9FB; --line:#E3E8EE; --line-soft:#F0F3F6; --line-2:#C6CFDB;
  --ink:#162030; --ink-2:#556174; --ink-3:#8791A1;
  --accent:#1E4E8E; --accent-ink:#FFFFFF;
  --uni-f:#DDE8F6; --uni-e:#2A64A8;
  --lern-f:#DAEFE3; --lern-e:#1B8454;
  --train-f:#FCE3D1; --train-e:#CF5713;
  --fest-f:#E6E8EC; --fest-e:#687283;
  --ev-f:#EFE6F8; --ev-h:#DFCDF0; --ev-e:#7A3EB1;
  --warn:#C23029; --warn-f:#FBE5E3; --now:#C23029; --on-now:#FFFFFF;
  --scrim:rgba(12,18,28,.45); --shadow:0 14px 44px rgba(22,32,48,.2);
  --f-disp:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E141D; --sheet:#151D29; --we:#121A25; --line:#233042; --line-soft:#1B2533; --line-2:#344357;
  --ink:#E4EAF2; --ink-2:#A2ADBD; --ink-3:#6F7B8C; --accent:#72A5E8; --accent-ink:#0E141D;
  --uni-f:#1B2E4A; --uni-e:#71A5E6; --lern-f:#15372A; --lern-e:#55C68F; --train-f:#40261A; --train-e:#F28B4B;
  --fest-f:#252C36; --fest-e:#9CA5B1; --ev-f:#2B1F3D; --ev-h:#3A2B52; --ev-e:#BC8FEA;
  --warn:#F2685E; --warn-f:#3B1D1D; --now:#F2685E; --on-now:#FFFFFF; --scrim:rgba(0,0,0,.6); --shadow:0 14px 44px rgba(0,0,0,.5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E141D; --sheet:#151D29; --we:#121A25; --line:#233042; --line-soft:#1B2533; --line-2:#344357;
  --ink:#E4EAF2; --ink-2:#A2ADBD; --ink-3:#6F7B8C; --accent:#72A5E8; --accent-ink:#0E141D;
  --uni-f:#1B2E4A; --uni-e:#71A5E6; --lern-f:#15372A; --lern-e:#55C68F; --train-f:#40261A; --train-e:#F28B4B;
  --fest-f:#252C36; --fest-e:#9CA5B1; --ev-f:#2B1F3D; --ev-h:#3A2B52; --ev-e:#BC8FEA;
  --warn:#F2685E; --warn-f:#3B1D1D; --now:#F2685E; --on-now:#FFFFFF; --scrim:rgba(0,0,0,.6); --shadow:0 14px 44px rgba(0,0,0,.5);
  color-scheme:dark}

[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html{color-scheme:light}
body{margin:0}
img{max-width:100%}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1280px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px));padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}

/* Schriftfeld */
.tb{display:grid;grid-template-columns:2.2fr 1fr 1.5fr 1.3fr;border:1.5px solid var(--ink);background:var(--sheet)}
.tb>div{padding:6px 10px 7px;border-left:1px solid var(--ink);min-width:0}
.tb>div:first-child{border-left:0}
.lbl{display:block;font-family:var(--f-disp);font-weight:500;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.tb strong{display:block;font-family:var(--f-disp);font-weight:600;font-size:20px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb .name strong{font-size:24px;font-weight:700;letter-spacing:.01em}
.tb .sync strong{font-size:15px;padding-top:4px}
@media (max-width:640px){
  .tb{grid-template-columns:1fr 1fr}
  .tb .name{grid-column:1/-1}
  .tb>div:nth-child(2),.tb>div:nth-child(3),.tb>div:nth-child(4){border-top:1px solid var(--ink)}
  .tb>div:nth-child(2){border-left:0}
  .tb>div:nth-child(4){grid-column:1/-1;border-left:0}
  .tb strong{font-size:18px}
}

/* Werkzeugleiste */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.grow{flex:1 1 0}
.btn{border:1px solid var(--line-2);background:var(--sheet);border-radius:8px;padding:8px 13px;font-weight:600;font-size:14px;line-height:1.2;min-height:38px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghostbtn{background:transparent}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.nav{display:flex}
.nav .btn{border-radius:0;margin-left:-1px}
.nav .btn:first-child{border-radius:8px 0 0 8px;margin-left:0}
.nav .btn:last-child{border-radius:0 8px 8px 0}
.nav .arrow{font-family:var(--f-mono);min-width:40px}
.seg{display:flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;background:var(--sheet)}
.seg button{border:0;background:transparent;padding:8px 14px;font-weight:600;font-size:14px;min-height:36px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* Kennzahlen */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line-2);border-radius:10px;background:var(--sheet);overflow:hidden}
.stat{padding:10px 14px;border-left:1px solid var(--line);min-width:0;display:flex;flex-direction:column;gap:4px}
.stat:first-child{border-left:0}
.stat .val{font-family:var(--f-disp);font-weight:600;font-size:21px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .val small{font-size:14px;color:var(--ink-2);font-weight:500}
.stat .sub{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px}
.m-lern i{background:var(--lern-e)} .m-train i{background:var(--train-e)}
@media (max-width:640px){.stats{grid-template-columns:1fr 1fr}.stat.next{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}}

/* Konflikt-Hinweis */
.alert{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--warn-f);border:1px solid var(--warn);border-radius:10px;padding:10px 14px}
.alert p{margin:0;flex:1 1 220px;font-weight:500}
.alert b{color:var(--warn)}

/* Tagesreiter */
.tabs{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.tabs button{border:1px solid var(--line-2);background:var(--sheet);border-radius:8px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
.tabs b{font-family:var(--f-disp);font-size:16px;font-weight:600}
.tabs span{font-family:var(--f-mono);font-size:11px;color:var(--ink-2)}
.tabs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.tabs button[aria-pressed="true"] span{color:var(--paper);opacity:.8}
.tabs button.today:not([aria-pressed="true"]){border-color:var(--accent);border-width:2px}
.tabs .dot{position:absolute;top:4px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--warn)}

/* Zeitraster */
.board{background:var(--sheet);border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.grid{display:grid;grid-template-columns:46px repeat(var(--cols),minmax(0,1fr))}
.grid.week{min-width:760px}
.dh{position:sticky;top:0;z-index:3;background:var(--sheet);border-bottom:1.5px solid var(--ink);border-left:1px solid var(--line);padding:7px 4px 6px;text-align:center}
.dh b{font-family:var(--f-disp);font-size:16px;font-weight:600;letter-spacing:.02em}
.dh span{display:block;font-family:var(--f-mono);font-size:11px;color:var(--ink-2)}
.dh.today b{color:var(--accent)}
.dh.today span{color:var(--accent);font-weight:500}
.corner{border-bottom:1.5px solid var(--ink);background:var(--sheet);position:sticky;top:0;z-index:3}
.times{position:relative}
.times span{position:absolute;right:6px;transform:translateY(-50%);font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.col{position:relative;border-left:1px solid var(--line)}
.col.we{background-color:var(--we)}
.now{position:absolute;left:0;right:0;height:2px;background:var(--now);z-index:4;pointer-events:none}
.now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--now)}

.blk{position:absolute;box-sizing:border-box;border-radius:6px;padding:4px 6px 4px 8px;overflow:hidden;background:var(--f);border-left:3px solid var(--e);display:flex;flex-direction:column;gap:1px;z-index:1;cursor:pointer;transition:transform .12s}
.blk:hover{transform:translateY(-1px)}
.k-uni{--f:var(--uni-f);--e:var(--uni-e)}
.k-lern{--f:var(--lern-f);--e:var(--lern-e)}
.k-train{--f:var(--train-f);--e:var(--train-e)}
.k-fest{--f:var(--fest-f);--e:var(--fest-e)}
.k-event{--f:var(--ev-f);--e:var(--ev-e)}
.blk.k-event{background:repeating-linear-gradient(135deg,var(--ev-f) 0 7px,var(--ev-h) 7px 9px);z-index:2}
.bt{font-weight:600;font-size:12.5px;line-height:1.18;overflow-wrap:anywhere}
.bs{font-size:11px;color:var(--ink-2);line-height:1.2}
.bm{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-2);margin-top:auto;font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;gap:0 6px}
.tag{font-family:var(--f-disp);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--e);font-weight:600}
.blk.tiny{padding-block:2px}
.blk.tiny .bs{display:none}
.blk.tiny .bm{display:none}
.blk.done{opacity:.6}
.blk.done .bt::before{content:"✓ ";color:var(--e)}
.blk.ghost{background:transparent;border:1.5px dashed var(--e);opacity:.6;z-index:0}
.blk.ghost .bt{text-decoration:line-through}
.blk.conflict{box-shadow:inset 0 0 0 2px var(--warn)}
.blk.conflict .bt::after{content:" !";color:var(--warn);font-weight:700}
.day .bt{font-size:15px}
.day .bs{font-size:12.5px}
.day .bm{font-size:12px}
.day .blk{padding:6px 44px 6px 10px}
.chkb{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;border:2px solid var(--e);background:var(--sheet);color:transparent;font-weight:700;font-size:15px;line-height:1;display:grid;place-items:center;padding:0}
.chkb.on{background:var(--e);color:var(--sheet)}

.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink-2);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:18px;height:11px;border-radius:3px;background:var(--f);border-left:3px solid var(--e);display:inline-block}
.legend i.k-event{background:repeating-linear-gradient(135deg,var(--ev-f) 0 4px,var(--ev-h) 4px 6px)}
.foot{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:center}
.link{border:0;background:none;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;padding:6px 0;font-size:13px}
.link.armed{color:var(--warn)}

/* Blatt (Dialog) */
.ov{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--sheet);color:var(--ink);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow);box-sizing:border-box;display:flex;flex-direction:column;gap:12px}
@media (min-width:700px){.ov{align-items:center;padding:24px}.sheet{border-radius:14px}}
.sh-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sh-top h2{margin:2px 0 0;font-family:var(--f-disp);font-size:26px;font-weight:600;line-height:1.1;text-wrap:balance}
.x{border:0;background:var(--line-soft);border-radius:50%;width:34px;height:34px;flex:none;font-size:18px;line-height:1;color:var(--ink-2)}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-disp);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--e)}
.chip::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--e)}
.meta{margin:0;color:var(--ink-2);font-size:14px}
.meta b{color:var(--ink);font-weight:600}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.warnbox{background:var(--warn-f);border-left:3px solid var(--warn);border-radius:6px;padding:9px 12px;font-size:14px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.row .btn{flex:1 1 150px}
.sheet h3{margin:6px 0 0;font-family:var(--f-disp);font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:1px solid var(--line-2);background:var(--sheet);border-radius:8px;padding:9px 12px}
.opt:hover{border-color:var(--accent)}
.opt .l{font-family:var(--f-mono);font-weight:500;font-size:14px;white-space:nowrap}
.opt .n{font-size:12.5px;color:var(--ink-2);text-align:right}
.empty{color:var(--ink-2);font-size:14px;margin:0}
.form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.form .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field input,.field select,.field textarea{font-size:16px;border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;background:var(--paper);min-width:0;width:100%;box-sizing:border-box}
.field textarea{min-height:96px;resize:vertical;line-height:1.4}
.cf{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.cf:first-of-type{border-top:0;padding-top:0}
.cf h4{margin:0;font-size:15px}
.cf p{margin:0;font-size:13.5px;color:var(--ink-2)}
.props{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.props label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line-2);border-radius:8px;padding:9px 11px;cursor:pointer}
.props input{margin-top:3px;width:18px;height:18px;flex:none;accent-color:var(--accent)}
.props small{display:block;color:var(--ink-2);font-size:12.5px}
.status{font-size:14px;color:var(--ink-2);margin:0}
.summary{margin:0;font-size:15px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-weight:500;font-size:14px;z-index:80;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
/* Ganztägig */
.ad-l{border-bottom:1.5px solid var(--line-2);font-family:var(--f-disp);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;justify-content:flex-end;padding:3px 6px 3px 0;background:var(--sheet)}
.ad{border-left:1px solid var(--line);border-bottom:1.5px solid var(--line-2);padding:3px;display:flex;flex-direction:column;gap:2px;min-width:0;min-height:26px;background:var(--sheet)}
.adc{display:block;width:100%;border:0;text-align:left;font-size:11.5px;font-weight:600;padding:3px 6px;border-radius:4px;background:var(--ev-e);color:var(--sheet);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day .adc{font-size:14px;padding:6px 10px}
.mp.allday{background:var(--ev-e);color:var(--sheet);border-left-color:var(--ev-e);font-weight:600}
.check{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;padding:4px 0;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--accent);margin:0}
/* Countdown Prüfungsphase */
.cd{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;border:1.5px solid var(--ink);background:var(--sheet);padding:8px 14px}
.cd .num{font-family:var(--f-disp);font-weight:700;font-size:42px;line-height:1;font-variant-numeric:tabular-nums;color:var(--warn)}
.cd .txt{display:flex;flex-direction:column;min-width:0;flex:1 1 180px}
.cd .txt b{font-family:var(--f-disp);font-size:19px;font-weight:600;line-height:1.15}
.cd .txt span{font-size:13px;color:var(--ink-2)}
.cd .wk{display:flex;flex-wrap:wrap;gap:3px;max-width:100%;flex:0 1 auto}
.cd .wk i{width:9px;height:9px;border-radius:2px;background:var(--warn);opacity:.85}
.cd .wk i.last{opacity:.35}
.mp.exam{background:var(--warn-f);border-left-color:var(--warn);font-weight:600}
.mdots i.exam{background:var(--warn)}
/* Monatsansicht */
.month{background:var(--sheet);border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
.mhead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px;padding:12px 14px 8px}
.mhead h2{margin:0;font-family:var(--f-disp);font-size:30px;font-weight:700;line-height:1.1}
.mhead span{color:var(--ink-2);font-size:13px}
.mwd,.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.mwd{border-bottom:1.5px solid var(--ink)}
.mwd span{text-align:center;font-family:var(--f-disp);font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);padding:2px 0 6px}
.mc{border:0;border-top:1px solid var(--line);border-left:1px solid var(--line);background:var(--sheet);min-height:108px;padding:5px;display:flex;flex-direction:column;align-items:stretch;gap:3px;text-align:left;min-width:0;border-radius:0}
.mgrid .mc:nth-child(7n+1){border-left:0}
.mgrid .mc:nth-child(-n+7){border-top:0}
.mc.we{background:var(--we)}

<body>
<div class="app">
  <header class="tb">

    <div><span class="lbl">Zeitraum</span><strong id="range" class="mono" style="font-family:var(--f-disp)">–</strong></div>

  <div class="bar">

    <button class="btn" id="add">+ Termin</button>

    <button class="btn" id="settings" aria-label="Einstellungen und Sicherung"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>

  <section class="cd" id="countdown" hidden aria-live="polite"></section>

  <div id="alert" hidden></div>

  <div class="foot">
    <div class="legend" id="legend">
      <span><i class="k-uni"></i>Uni (fest)</span>
      <span><i class="k-lern"></i>Selbststudium</span>

</div>
<div id="ov" class="ov" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" hidden></div>

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, "0");
const toM = s => { const [a, b] = s.split(":").map(Number); return a * 60 + b; };
const hm = n => pad(Math.floor(n / 60)) + ":" + pad(n % 60);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtH = min => { const h = Math.floor(min / 60), m = min % 60; return m === 0 ? h + " h" : m === 30 ? h + ",5 h" : (h ? h + " h " : "") + m + " min"; };
const DAYS = ["Mo","Di","Mi","Do","Fr","Sa","So"];
const DAYS_L = ["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
const KL = {uni:"Uni", lern:"Selbststudium", train:"Training", fest:"Termin", event:"Eigener Termin"};
const ALL = [0,1,2,3,4,6];
const movable = i => i.k === "lern" || i.k === "train";

/* ---------- Wochenvorlage ---------- */
const T = (id, d, s, e, t, k, x = {}) => ({id, d, s: toM(s), e: toM(e), t, k, ...x});
const TPL = [
  T("longrun",0,"08:00","10:30","Long Run","train",{min:150,hard:true,days:ALL,sub:"mind. 2,5 h"}),
  T("sw-v",0,"12:00","13:30","Straßenwesen I","uni",{sub:"Vorlesung",room:"A-05 5.E.11"}),
  T("sw-u",0,"14:00","15:30","Straßenwesen I","uni",{sub:"Übung",room:"A-08 8.2.01/02"}),
  T("sw-e",0,"16:00","17:30","Eigenübung Straßenwesen I","lern",{days:ALL}),
  T("bb",0,"18:30","19:30","Baubetrieb","lern",{days:ALL}),
  T("kraft-di",1,"07:30","09:30","Kraft Oberkörper","train",{min:60,days:ALL}),
  T("mb-sb",1,"10:00","11:30","Massivbau Stahlbetonbau","lern",{sub:"Selbststudium",days:ALL}),
  T("sh-sem1",1,"12:00","13:30","Stahlbau II und Holzbau II","uni",{sub:"Seminar",room:"A-05 5.E.11"}),
  T("mb-mw-v",1,"14:00","15:30","Massivbau III · Mauerwerksbau","uni",{sub:"Vorlesung",room:"A-05 5.E.11"}),
  T("bk",1,"16:00","17:30","Baustellenkoordinator DUAL","uni",{sub:"Vorlesung",room:"A-05 5.E.11"}),
  T("mb-mw",1,"18:30","20:00","Massivbau Mauerwerksbau","lern",{sub:"Selbststudium",days:ALL}),
  T("sh-sem2",2,"08:00","09:30","Stahlbau II und Holzbau II","uni",{sub:"Seminar",room:"A-08 8.2.01/02"}),
  T("da-1",2,"10:00","11:30","Digitale Arbeitsweisen","uni",{sub:"mit Beleg",room:"A-05 5.1.12"}),
  T("da-2",2,"12:00","13:30","Digitale Arbeitsweisen","uni",{sub:"mit Beleg",room:"A-05 5.1.12"}),
  T("da-e",2,"14:30","16:00","Eigenübung Digitale Arbeitsweisen","lern",{days:ALL}),
  T("swim",2,"16:30","19:00","Schwimmen","train",{min:90,days:ALL}),
  T("vo2",3,"07:00","09:00","VO2max","train",{min:60,hard:true,days:ALL}),
  T("wb-v",3,"10:00","11:30","Wasserbau I und Wasserwirtschaft I","uni",{sub:"Vorlesung",room:"A-04 4.E.04"}),
  T("wb-u",3,"12:00","13:30","Wasserbau I und Wasserwirtschaft I","uni",{sub:"Übung",room:"A-01 1.2.12-14"}),
  T("kbf",3,"14:00","17:30","Kaufmännische Betriebsführung","uni",{sub:"Vorlesung",room:"A-01 1.2.12-14"}),
  T("vers",3,"19:00","21:00","Versammlung","fest"),
  T("bbw",4,"09:00","10:00","Baubetriebswirtschaft","lern",{days:ALL}),
  T("st-e",4,"10:15","11:45","Eigenübung Stahlbau II","lern",{days:ALL}),
  T("wb-e",4,"12:45","14:15","Eigenübung Wasserbau I","lern",{days:ALL}),
  T("kraft-fr",4,"16:00","18:00","Kraft Oberkörper","train",{min:60,days:ALL}),
  T("bike",5,"08:30","12:30","Long Bike","train",{min:180,hard:true,days:[5,6],sub:"3–4 h"}),
  T("hb-e",6,"18:00","19:30","Eigenübung Holzbau II","lern",{days:ALL}),
];
const TPL_BY = Object.fromEntries(TPL.map(b => [b.id, b]));
const LERN_TARGET = TPL.filter(b => b.k === "lern").reduce((a, b) => a + b.e - b.s, 0);

/* ---------- Datum ---------- */
const mondayOf = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; };
const keyOf = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const ddmm = d => pad(d.getDate()) + "." + pad(d.getMonth() + 1) + ".";
function isoWeek(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const day = d.getUTCDay() || 7; d.setUTCDate(d.getUTCDate() + 4 - day);
  const y = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return Math.ceil(((d - y) / 86400000 + 1) / 7);
}
const todayIdx = () => (new Date().getDay() + 6) % 7;
const fromKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const MONTHS = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const longDate = d => DAYS_L[(d.getDay() + 6) % 7] + ", " + d.getDate() + ". " + MONTHS[d.getMonth()];
const curKey = () => keyOf(mondayOf(new Date()));

let weekMon = mondayOf(new Date());
let weekKey = keyOf(weekMon);
const isCurrent = () => weekKey === curKey();
function nowAbs() {
  const c = curKey();
  if (weekKey === c) { const n = new Date(); return todayIdx() * 1440 + n.getHours() * 60 + n.getMinutes(); }
  return weekKey < c ? Infinity : -Infinity;
}

/* ---------- Zustand ---------- */
const emptyWeek = () => ({moves:{}, cancels:{}, done:{}, acks:{}, events:[]});
function normalize(d) {
  d = d ? JSON.parse(JSON.stringify(d)) : {};
  const obj = v => v && typeof v === "object" && !Array.isArray(v) ? v : {};
  const w = {moves: {}, cancels: obj(d.cancels), done: obj(d.done), acks: obj(d.acks), events: []};
  for (const [id, m] of Object.entries(obj(d.moves)))
    if (TPL_BY[id] && Number.isFinite(m.day) && Number.isFinite(m.start) && Number.isFinite(m.end)) w.moves[id] = {day: m.day, start: m.start, end: m.end};
  if (Array.isArray(d.events)) for (const e of d.events)
    if (e && e.id && Number.isFinite(e.day) && Number.isFinite(e.start) && Number.isFinite(e.end) && e.end > e.start)
      w.events.push({id: String(e.id), title: String(e.title || "Termin").slice(0, 80), day: e.day, start: e.start, end: e.end, ...(e.allDay === true ? {allDay: true} : {})});
  return w;
}
let ws = emptyWeek();

function items() {
  const out = [];
  for (const b of TPL) {
    const mv = ws.moves[b.id];
    out.push({...b, day: mv ? mv.day : b.d, start: mv ? mv.start : b.s, end: mv ? mv.end : b.e,
      moved: !!mv, cancelled: !!ws.cancels[b.id], done: !!ws.done[b.id], src: "tpl"});
  }
  for (const e of ws.events) if (!e.allDay) out.push({id: e.id, t: e.title, k: "event", day: e.day, start: e.start, end: e.end, src: "ev"});
  return out;
}

function conflicts(list) {
  const evs = list.filter(i => i.k === "event");
  const res = [];
  for (const b of list) {
    if (b.src !== "tpl" || b.cancelled) continue;
    const hits = evs.filter(e => e.day === b.day && e.start < b.end && b.start < e.end);
    if (!hits.length) continue;
    const sig = hits.map(h => h.id).sort().join(",");
    if (ws.acks[b.id] === sig) continue;
    res.push({b, hits, sig});
  }
  const ord = {uni: 0, fest: 0, lern: 1, train: 2};
  return res.sort((a, c) => ord[a.b.k] - ord[c.b.k] || a.b.day - c.b.day || a.b.start - c.b.start);
}

/* ---------- Planungslogik ---------- */
// Selbststudium hat Vorrang vor Training. Samstag bleibt frei (nur Long Bike). Sonntag Lernen erst ab 15 Uhr.
const win = (b, d) => b.k === "lern" ? (d === 6 ? [900, 1260] : [480, 1260]) : [390, 1260];
function suggest(b, list, max = 3) {
  const dur = b.end - b.start, na = nowAbs(), found = [];
  const others = list.filter(i => !i.cancelled && i.id !== b.id);
  const pass = soft => {
    const occ = soft ? others.filter(i => i.k !== "train") : others;
    for (const d of (b.days || ALL)) {
      if (b.hard && others.some(i => i.hard && Math.abs(i.day - d) <= 1)) continue;
      const [w0, w1] = win(b, d);
      let best = null;
      for (let s = Math.ceil(w0 / 15) * 15; s + dur <= w1; s += 15) {
        if (d * 1440 + s <= na) continue;
        if (d === b.day && s === b.start) continue;
        const e = s + dur;
        if (occ.some(o => o.day === d && o.start < e + 15 && s < o.end + 15)) continue;
        let disp = [];
        if (soft) {
          disp = others.filter(o => o.k === "train" && o.day === d && o.start < e + 15 && s < o.end + 15).map(o => o.id);
          if (!disp.length) continue;
        }
        let sc = Math.abs(d - b.day) * 6 + Math.abs(s - b.start) / 60;
        if (e > 1200) sc += 1.5;
        if (b.k === "lern" && d === 3) sc += 2;
        if (b.k === "train" && d === 6) sc += 3;
        const load = occ.filter(o => o.day === d).reduce((a, o) => a + o.end - o.start, 0) + dur;
        if (load > 600) sc += 3;
        if (soft) sc += 4;
        if (!best || sc < best.sc) best = {d, s, e, sc, disp};
      }
      if (best) found.push(best);
    }
  };
  pass(false);
  if (b.k === "lern" && found.length < 2) pass(true);
  const seen = new Set();
  return found.sort((a, c) => a.sc - c.sc).filter(c => !seen.has(c.d) && seen.add(c.d)).slice(0, max);
}
function shorten(b, list) {
  if (!b.min) return null;
  const occ = list.filter(i => !i.cancelled && i.id !== b.id && i.day === b.day && i.start < b.end + 15 && b.start < i.end + 15)
    .map(i => [Math.max(b.start, i.start - 15), Math.min(b.end, i.end + 15)]).sort((x, y) => x[0] - y[0]);
  let cur = b.start, best = null;
  const take = (a, z) => { if (z > a && (!best || z - a > best[1] - best[0])) best = [a, z]; };
  for (const [a, z] of occ) { take(cur, a); cur = Math.max(cur, z); }
  take(cur, b.end);
  if (!best) return null;
  best = [Math.ceil(best[0] / 15) * 15, Math.floor(best[1] / 15) * 15];
  const L = best[1] - best[0];
  return L >= b.min && L < b.end - b.start ? best : null;
}
function optionsFor(b, list) {
  const opts = [];
  if (b.k === "train" && !b.cancelled) {
    const sh = shorten(b, list);
    if (sh) opts.push({d: b.day, s: sh[0], e: sh[1], disp: [], label: `${DAYS[b.day]} ${hm(sh[0])}–${hm(sh[1])}`, note: `kürzen auf ${fmtH(sh[1] - sh[0])}`});
  }
  for (const c of suggest(b, list)) {
    const names = c.disp.map(id => TPL_BY[id].t).join(", ");
    opts.push({...c, label: `${DAYS[c.d]} ${hm(c.s)}–${hm(c.e)}`,
      note: c.disp.length ? `${names} wird dafür gekürzt oder fällt aus` : c.d === b.day ? "gleicher Tag" : DAYS_L[c.d]});
  }
  return opts;
}
function setTime(id, d, s, e) {
  const b = TPL_BY[id];
  if (d === b.d && s === b.s && e === b.e) delete ws.moves[id]; else ws.moves[id] = {day: d, start: s, end: e};
  delete ws.cancels[id]; delete ws.acks[id];
}
function applyMove(id, d, s, e, disp) {
  setTime(id, d, s, e);
  for (const tid of disp || []) {
    const list = items(), t = list.find(i => i.id === tid);
    const sh = t && shorten(t, list);
    if (sh) setTime(tid, t.day, sh[0], sh[1]); else ws.cancels[tid] = true;
  }
}
const optHtml = (id, o) => `<button class="opt" data-apply="${id}" data-d="${o.d}" data-s="${o.s}" data-e="${o.e}" data-disp="${o.disp.join(",")}"><span class="l">${o.label}</span><span class="n">${esc(o.note)}</span></button>`;

/* ---------- Speicherung ---------- */
let db = null, uid = null, mode = "wait", unsub = null, pending = 0, chain = Promise.resolve();
const LS = "sttr-";
const mem = {};
const lsGet = k => { if (k in mem) return mem[k]; try { return JSON.parse(localStorage.getItem(LS + k) || "null"); } catch { return null; } };
const lsSet = (k, v) => { mem[k] = v; try { localStorage.setItem(LS + k, JSON.stringify(v)); } catch {} };
const docPath = k => `data/users/${uid}/wk-${k}`;
const setSync = t => { $("#sync").textContent = t; };
const syncOk = () => setSync(navigator.onLine === false ? "Auf dem iPhone · offline" : "Auf dem iPhone");

function subscribe() {
  if (unsub) { unsub(); unsub = null; }
  if (mode !== "db") { ws = normalize(lsGet(weekKey)); render(); return; }
  const key = weekKey;
  unsub = db.doc(docPath(key)).onSnapshot(snap => {
    if (key !== weekKey || pending > 0) return;
    ws = normalize(snap.exists ? snap.data() : null);
    syncOk(); render();
  }, () => setSync("Offline · lädt neu"));
}
function persist(key, data) {
  pending++; setSync("Speichert …");
  chain = chain.then(async () => {
    try {
      if (mode === "db") await db.doc(docPath(key)).set(data); else lsSet(key, data);
    } catch (e) {
      toast(e && e.code === "quota_exceeded" ? "Speicher voll. Alte Wochen zurücksetzen." : "Nicht gespeichert. Prüfe die Verbindung.");
      setSync("Nicht gespeichert"); pending--; return;
    }
    pending--; if (!pending) syncOk();
  });
}
let saveTimer = null, saveKey = null, saveData = null;
function commit() {
  render();
  if (sheetRefresh) sheetRefresh();
  saveKey = weekKey; saveData = JSON.parse(JSON.stringify(ws));
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 350);
}
function flush() { if (saveKey) { persist(saveKey, saveData); saveKey = null; } }
async function writeOtherWeek(key, fn) {
  let data;
  if (mode === "db") { const s = await db.doc(docPath(key)).get(); data = normalize(s.exists ? s.data() : null); }
  else data = normalize(lsGet(key));
  fn(data);
  persist(key, data);
  await chain;
  if (mode === "db") allWeeks = {...allWeeks, [key]: data};
  render();
}
/* Alle Wochen für die Monatsübersicht (nur eigene Termine werden daraus gelesen) */
let allWeeks = {}, unsubAll = null;
function subscribeAll() {
  if (mode !== "db" || unsubAll) return;
  unsubAll = db.collection(`data/users/${uid}`).limit(1000).onSnapshot(snap => {
    const m = {};
    for (const d of snap.docs) if (d.id.startsWith("wk-")) m[d.id.slice(3)] = normalize(d.data());
    allWeeks = m;
    if (view === "month") render();
  }, () => {});
}
function weekEvents(key) {
  if (key === weekKey) return ws.events;
  if (mode === "db") return (allWeeks[key] || {events: []}).events;
  if (mode === "local") return normalize(lsGet(key)).events;
  return [];
}
function eventsOn(date) {
  const key = keyOf(mondayOf(date)), d = (date.getDay() + 6) % 7;
  return weekEvents(key).filter(e => e.day === d).map(e => ({...e, key})).sort((a, b) => (b.allDay ? 1 : 0) - (a.allDay ? 1 : 0) || a.start - b.start);
}
async function initStore() {
  mode = "local";
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch {}
  syncOk(); subscribe();
}

/* ---------- Ansicht ---------- */
let view = (() => { try { return localStorage.getItem(LS + "view"); } catch { return null; } })() || (innerWidth < 720 ? "day" : "week");
let selDay = todayIdx();

function renderMonth() {

function renderStats(list) {

  const lp = sum(i => i.k === "lern"), ld = sum(i => i.k === "lern" && i.done);
  const tp = sum(i => i.k === "train"), td = sum(i => i.k === "train" && i.done);

  else {
    const all = list.filter(i => !i.cancelled && !i.done).sort((a, b) => (a.day * 1440 + a.start) - (b.day * 1440 + b.start));

function layLanes(arr) {

function renderGrid(list, conf) {

}

      h += `<div class="cf"><h4><span class="chip k-${b.k}">${KL[b.k]}</span><br>${esc(b.t)} · ${DAYS[b.day]} <span class="mono">${hm(b.start)}–${hm(b.end)}</span></h4>`;
      h += `<p>Kollidiert mit ${c.hits.map(x => `<b>${esc(x.t)}</b> (${hm(x.start)}–${hm(x.end)})`).join(", ")}.</p>`;

      }

  draw();

async function saveEvent(ev, origKey = weekKey) {

  const err = t => { const p = $("#eErr"); p.textContent = t; p.hidden = false; };

  const allDay = $("#eAll").checked;

  if (!allDay && (!sv || !evv)) return err("Beginn und Ende ausfüllen.");
  const s = allDay ? 0 : toM(sv), e = allDay ? 1440 : toM(evv);

  const rm = w => { w.events = w.events.filter(x => x.id !== rec.id); };
  const removeElsewhere = ev && origKey !== weekKey && origKey !== key;
  if (ev && origKey === weekKey) ws.events = ws.events.filter(x => x.id !== ev.id);
  if (key === weekKey) {
    ws.events.push(rec);
    commit();
    if (removeElsewhere) writeOtherWeek(origKey, rm).catch(() => toast("Alter Eintrag nicht gelöscht. Prüfe die Verbindung."));
    const cf = view === "month" ? [] : conflicts(items()).filter(c => c.hits.some(x => x.id === rec.id));
    if (cf.length) openResolve(); else { closeSheet(); toast(ev ? "Termin geändert" : "Termin eingetragen"); }

$("#next").onclick = () => view === "month" ? shiftMonth(1) : goWeek(addDays(weekMon, 7));
$("#today").onclick = () => {
  if (view === "month") { const n = new Date(); monthCur = new Date(n.getFullYear(), n.getMonth(), 1); monthSel = new Date(n.getFullYear(), n.getMonth(), n.getDate()); render(); return; }
  if (isCurrent()) { selDay = todayIdx(); render(); } else goWeek(mondayOf(new Date()));
};
$("#add").onclick = () => view === "month" ? openEvent(null, null, monthSel) : openEvent(null);
$("#ask").onclick = () => openAsk();
$("#settings").onclick = () => openSettings();
let armT = null;
$("#resetWeek").onclick = e => {
  const b = e.currentTarget;
  if (!b.classList.contains("armed")) {
    b.classList.add("armed"); b.textContent = "Nochmal tippen: Verschiebungen, Ausfälle und Häkchen löschen (eigene Termine bleiben)";
    clearTimeout(armT); armT = setTimeout(() => { b.classList.remove("armed"); b.textContent = "Änderungen dieser Woche zurücksetzen"; }, 5000);
    return;
  }
  clearTimeout(armT); b.classList.remove("armed"); b.textContent = "Änderungen dieser Woche zurücksetzen";
  ws = {...emptyWeek(), events: ws.events}; commit(); toast("Woche zurückgesetzt");
};

/* Minütlich: Jetzt-Linie; bei Wochenwechsel automatisch in die neue Woche */
let lastCur = curKey();
setInterval(() => {
  const c = curKey();
  if (c !== lastCur) { const follow = weekKey === lastCur; lastCur = c; if (follow) { goWeek(mondayOf(new Date())); return; } }
  if ($("#ov").hidden) render();
}, 60000);

render();
initStore();
addEventListener("online", syncOk);
addEventListener("offline", syncOk);
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
})();
</script>
